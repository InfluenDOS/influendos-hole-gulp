<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#140e0c" />
    <meta name="description" content="黑洞一口吞：拖动黑洞，先吞小的再吞大的，把桌子吃干净。" />
    <title>黑洞一口吞</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <style>
      @font-face {
        font-family: "Noto Sans SC";
        src: url("./assets/fonts/NotoSansSC-Bold.woff2") format("woff2");
        font-weight: 700;
        font-style: normal;
        font-display: swap;
      }
      html,
      body,
      #app {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #140e0c;
        overflow: hidden;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }
      #app {
        position: relative;
      }
      #boot {
        position: absolute;
        left: 50%;
        top: 46%;
        width: 52px;
        height: 52px;
        margin: -26px 0 0 -26px;
        border-radius: 50%;
        border: 5px solid #4a3428;
        border-top-color: #ff8a3d;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="app"><div id="boot"></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
